name: Fetch EASA CZIBs

on:
  schedule:
    # Every 6 hours, UTC. First of the two source repos in the pipeline —
    # conflict-zones-combine runs on its own, later, staggered cron.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write   # needed so the workflow can commit data/raw_easa.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch EASA CZIBs + Information Notes
        run: python scripts/fetch_easa.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "czib-fetch-easa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw_easa.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update EASA raw data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
